; Optimización de OPcache para el entorno local de pruebas del SAMCE.
; Compensa la latencia del sistema de archivos montado desde Windows.

opcache.enable=1
opcache.enable_cli=0

; Moodle 4.5 supera los 15.000 archivos PHP: con el valor por defecto (10.000)
; la caché se llena, desaloja entradas y vuelve a leer del disco en cada petición.
opcache.max_accelerated_files=32531
opcache.memory_consumption=512
opcache.interned_strings_buffer=32

; Revalidación espaciada: reduce las verificaciones de fecha sobre el sistema
; de archivos lento. Los cambios en el código se toman al minuto.
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Caché de rutas resueltas: evita repetir la resolución de rutas en cada petición.
realpath_cache_size=8M
realpath_cache_ttl=600

; Compilación JIT para el código ya cacheado.
opcache.jit_buffer_size=128M
opcache.jit=tracing
